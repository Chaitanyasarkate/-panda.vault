version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vaultx_postgres
    restart: always
    environment:
      POSTGRES_USER: vaultx
      POSTGRES_PASSWORD: vaultx_password
      POSTGRES_DB: vaultx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultx -d vaultx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vaultx_backend
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: vaultx
      POSTGRES_PASSWORD: vaultx_password
      POSTGRES_DB: vaultx_db
      JWT_SECRET: super-secret-jwt-key-change-in-production-vaultx-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
