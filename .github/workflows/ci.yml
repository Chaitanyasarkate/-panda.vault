name: panda.vault CI Security & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-audit-and-test:
    name: Backend Security & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Security Scan (Bandit)
        run: |
          bandit -r app -ll

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest -v

  frontend-test-and-build:
    name: Frontend Vitest & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Vitest Suite
        run: npx vitest run

      - name: Build Next.js Production Bundle
        run: npm run build

  extension-test-and-build:
    name: Extension Vitest & Bundle Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Extension Dependencies
        run: npm ci

      - name: Run Extension Vitest Suite
        run: npx vitest run

      - name: Build Extension Production Bundle
        run: npm run build
