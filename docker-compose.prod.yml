version: '3.8'

services:
  # Isolated PostgreSQL Database (Zero public host ports)
  db:
    image: postgres:16-alpine
    container_name: pandavault_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vaultx_prod}
    # No ports exposed to host machine!
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - vault_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultx} -d ${POSTGRES_DB:-vaultx_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hardened FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pandavault_backend
    restart: always
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-vaultx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vaultx_prod}
      JWT_SECRET: ${JWT_SECRET}
      PEPPER_SECRET: ${PEPPER_SECRET}
      COOKIE_SECURE: "true"
      BACKEND_CORS_ORIGINS: "${FRONTEND_URL:-https://vault.yourdomain.com}"
    expose:
      - "8000"
    networks:
      - vault_internal
      - vault_public
    depends_on:
      db:
        condition: service_healthy

  # Optional Cloudflare Tunnel Daemon (Direct Zero-Trust ingress)
  # Uncomment and provide CLOUDFLARE_TUNNEL_TOKEN in .env.production to make backend 100% private
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pandavault_tunnel
    restart: always
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - vault_public
    depends_on:
      - backend

volumes:
  postgres_prod_data:

networks:
  # Internal network strictly for DB <-> Backend communication
  vault_internal:
    internal: true
  # Network for Backend <-> Cloudflare Tunnel ingress
  vault_public:
    driver: bridge
